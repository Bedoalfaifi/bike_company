<!-- Requires: core/reset.css, core/tokens.css + input-label styles -->
<div class="password-field">
  <label class="input-label" for="pw-example">كلمة المرور</label>
  <div class="password-field__wrap" dir="rtl">
    <input
      class="password-field__input"
      id="pw-example"
      type="password"
      name="password"
      autocomplete="current-password"
      placeholder="ادخل كلمة المرور"
    />
    <button type="button" class="password-field__toggle" aria-label="إظهار كلمة المرور" aria-pressed="false">
      <img src="../../assets/images/icon-eye-hidden.svg" alt="" width="24" height="24" />
    </button>
  </div>
</div>
