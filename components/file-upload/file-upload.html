<!-- Requires: core/reset.css, core/tokens.css -->
<div class="file-upload" data-file-upload>
  <input class="upload-file-input" type="file" id="upload-example" />
  <div class="upload-area">
    <div class="upload-icon-wrap" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M12 16V8m0 0l3 3m-3-3l-3 3"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M5 18h14"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>
    </div>
    <button type="button" class="upload-link" data-upload-trigger>اختر ملفًا</button>
    <p class="upload-hint" data-upload-hint>PNG أو JPG حتى ٥ ميجابايت</p>
  </div>
</div>
